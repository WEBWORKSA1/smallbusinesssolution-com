# Daily auto-refresh of news & videos.
# ACTIVATE: move this file to .github/workflows/update-feeds.yml
# (GitHub → this file → ✏️ Edit → change the path at the top to .github/workflows/update-feeds.yml → Commit).
name: Update news & video feeds
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_feeds.py, .github/workflows/update-feeds.yml]
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/update_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "sbs-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: daily feed refresh $(date -u +%F)"
          git push
